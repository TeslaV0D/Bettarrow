# ---------------------------------------------------------------------------
# Bettarrow – Docker Compose / Portainer stack
#
# The app image is built and published by GitHub Actions (.github/workflows/ci.yml) to
#   ghcr.io/teslav0d/bettarrow:main          (latest successful build of main)
#   ghcr.io/teslav0d/bettarrow:sha-<commit>  (immutable, one per commit)
# Nothing is built on the server. To build locally instead: see compose.build.yaml.
#
# Portainer: Stacks → Add stack → Repository, Compose path: compose.yaml (see README.md)
# Required variables (set in Portainer or in .env): POSTGRES_PASSWORD, APP_PASSWORD_HASH
#
# Start order: db (healthy) → migrate (one-shot job, must succeed) → web
# Data lives in the named volumes bettarrow-db-data / bettarrow-backups and survives
# container replacement, image updates, restarts and stack redeploys.
# ---------------------------------------------------------------------------
name: bettarrow

x-app-image: &app-image
  image: ${BETTARROW_IMAGE:-ghcr.io/teslav0d/bettarrow}:${BETTARROW_TAG:-main}
  # always: every `docker compose up` / Portainer redeploy checks the registry and pulls a newer
  # image for the tag, so a moving tag like `main` is picked up reliably.
  pull_policy: ${BETTARROW_PULL_POLICY:-always}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: bettarrow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bettarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bettarrow}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port: only reachable from the other services in this stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  # One-shot job: applies database migrations + built-in exercise data, then exits.
  # Runs on every deploy/redeploy before the web app starts (idempotent, advisory-locked).
  migrate:
    <<: *app-image
    container_name: bettarrow-migrate
    command: ["node", "migrate.mjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bettarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bettarrow}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
    healthcheck:
      disable: true
    logging: *logging

  web:
    <<: *app-image
    container_name: bettarrow-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bettarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bettarrow}
      MIGRATE_ON_START: "false"
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      TZ: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      # Named volume by default; set BACKUP_PATH to an absolute host path (e.g. /srv/bettarrow/backups)
      # to get the backup files directly on the host.
      - ${BACKUP_PATH:-backups}:/backups
    logging: *logging

volumes:
  db-data:
    name: bettarrow-db-data
  backups:
    name: bettarrow-backups
