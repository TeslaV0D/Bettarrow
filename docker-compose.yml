# Bettarrow – self-hosted gym training tracker
#   cp .env.example .env   # set APP_PASSWORD_HASH and POSTGRES_PASSWORD
#   docker compose up -d --build
name: bettarrow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bettarrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bettarrow}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published ports: the database is only reachable from the app container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    image: bettarrow:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bettarrow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bettarrow}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${DEFAULT_TIMEZONE:-Europe/Berlin}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      - ./backups:/backups
    logging: *logging

volumes:
  db-data:
